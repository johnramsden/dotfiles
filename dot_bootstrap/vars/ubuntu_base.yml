---
# Packages installed on every Ubuntu host
ubuntu_base_packages:
  - ubuntu-dev-tools
  - tox
  - apt-file
  - golang-go
  - openssh-server
  - git
  - zsh
  - openssh-client
  - curl
  - wget
  - nano
  - build-essential
  - flatpak
  - man-db
  - manpages
  - rsync
  - htop
  - gnupg
  - ca-certificates
  - syncthing
  - autofs
  - python3-pip
  - python3-venv
  - python3-debian
  - unzip
  - tmux
  - pinentry-curses
  - xclip
  - bats

base_external_repos:
  - name: mattermost-desktop
    uris: https://deb.packages.mattermost.com
    suites: stable
    components: [main]
    signed_by: https://deb.packages.mattermost.com/pubkey.gpg
    legacy_source_files:
      - /etc/apt/sources.list.d/mattermost-desktop.list
    packages:
      - mattermost-desktop

base_external_debs:
  - name: vscode
    deb_url: "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"
  - name: google-chrome
    deb_url: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"

base_snap_packages:
  - {name: pycharm-professional, classic: true}
  - {name: goland, classic: true}
  - {name: gitkraken, classic: true}
  - {name: discord}
  - {name: lxd}
  - {name: juju}
  - {name: snapcraft, classic: true}
  - {name: multipass}
  - {name: rockcraft, classic: true}
  - {name: docker}
  - {name: jhack, channel: "edge"}
  # - {name: microk8s, channel: "1.28-strict/stable"}
  - {name: charmcraft, classic: true}
  - {name: testflinger-cli}
  - {name: spotify}
  - {name: gh, classic: true}
  - {name: element-desktop}
  - {name: obsidian, classic: true}
  - {name: mermaid-cli}
