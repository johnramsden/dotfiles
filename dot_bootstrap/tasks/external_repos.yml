---
# Install packages from already-configured repositories and direct .deb URLs.
# Requires: all_external_repos and all_external_debs (merged in canonical.yml)

- name: Install packages from external repositories
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  apt:
    name: "{{ item.1 }}"
    state: present
  loop: "{{ all_external_repos | subelements('packages') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Install packages from direct .deb URLs
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  apt:
    deb: "{{ item.deb_url }}"
  loop: "{{ all_external_debs }}"
  loop_control:
    label: "{{ item.name }}"
